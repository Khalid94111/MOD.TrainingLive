@if (isOpen()) {
  <div class="confirm-backdrop" (click)="onBackdropClick($event)" (keydown)="onKeydown($event)" tabindex="-1">
    <div class="confirm-box" [class.confirm-danger]="danger()">
      <div class="confirm-icon">{{ headerIcon }}</div>
      <h3 class="confirm-title">{{ title() }}</h3>
      <p class="confirm-message">{{ message() }}</p>
      @if (detail()) {
        <div class="confirm-detail">{{ detail() }}</div>
      }
      <div class="confirm-actions">
        <button type="button" class="btn btn-outline" (click)="onCancel()">{{ cancelText() }}</button>
        <button type="button"
                class="btn"
                [class.btn-danger]="danger()"
                [class.btn-primary]="!danger()"
                (click)="onConfirm()">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
