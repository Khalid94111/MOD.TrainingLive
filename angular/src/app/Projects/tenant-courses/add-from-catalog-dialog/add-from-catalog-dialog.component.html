<dx-popup [visible]="visible()" (visibleChange)="cancelled.emit()"
  [title]="'::Training.AddFromCatalog' | abpLocalization" [showCloseButton]="true" [dragEnabled]="true"
  [width]="800" [height]="'auto'" [maxHeight]="'85vh'">
  <div *dxTemplate="let data of 'content'" class="dialog-body">

    <div class="info-banner">
      <span class="info-banner__icon">ℹ️</span>
      <div class="info-banner__text">{{ '::Training.SelectCoursesInfo' | abpLocalization }}</div>
    </div>

    <dx-data-grid [dataSource]="dataSource" [showBorders]="true" [showRowLines]="true"
      [hoverStateEnabled]="true" [remoteOperations]="true" [columnAutoWidth]="true" keyExpr="id"
      (onSelectionChanged)="onSelectionChanged($event)" class="catalog-select-grid">
      <dxo-selection mode="multiple" [showCheckBoxesMode]="'always'"></dxo-selection>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showInfo]="true"></dxo-pager>
      <dxo-search-panel [visible]="true" [placeholder]="'::Training.SearchByName' | abpLocalization"></dxo-search-panel>

      <dxi-column dataField="courseNameAr" [caption]="'::Training.CourseName' | abpLocalization" [minWidth]="200" cellTemplate="nameTpl"></dxi-column>
      <div *dxTemplate="let c of 'nameTpl'">
        <div class="cell-name">{{ c.data.courseNameAr }}</div>
        <div class="cell-sub">{{ c.data.courseNameEn }}</div>
      </div>

      <dxi-column dataField="category" [caption]="'::Training.Category' | abpLocalization" [width]="100" cellTemplate="catTpl"></dxi-column>
      <div *dxTemplate="let c of 'catTpl'"><span class="pill pill--green">{{ l.category(c.data.category) }}</span></div>

      <dxi-column dataField="fieldNameAr" [caption]="'::Training.Field' | abpLocalization" [width]="130"></dxi-column>

      <dxi-column dataField="conditionsCount" [caption]="'::Training.Conditions' | abpLocalization" [width]="90" cellTemplate="condTpl"></dxi-column>
      <div *dxTemplate="let c of 'condTpl'">
        <span class="pill pill--gray">{{ c.data.conditionsCount > 0 ? c.data.conditionsCount + ' شروط' : '—' }}</span>
      </div>
    </dx-data-grid>

    <div class="selection-footer">
      <span class="selection-footer__count">✓ {{ selectedCountText }}</span>
      <div class="selection-footer__actions">
        <button class="btn-outline" (click)="onCancel()">{{ '::Training.Cancel' | abpLocalization }}</button>
        <button class="btn-gradient btn-gradient--primary" [disabled]="selectedCourseIds().length === 0 || isSaving()"
          [class.btn-gradient--disabled]="selectedCourseIds().length === 0" (click)="onConfirm()">
          {{ '::Training.AddSelected' | abpLocalization }}
        </button>
      </div>
    </div>
  </div>
</dx-popup>
