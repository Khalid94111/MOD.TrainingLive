<div class="pipeline" role="navigation" aria-label="مراحل الدورة">
  @if (isRejected()) {
    <div class="pipeline-banner pipeline-banner-rejected">
      <span class="pipeline-banner-icon">⛔</span>
      تم رفض الطلب — لا توجد مراحل تالية.
    </div>
  } @else if (isReturned()) {
    <div class="pipeline-banner pipeline-banner-returned">
      <span class="pipeline-banner-icon">↩</span>
      تمت إعادة الطلب لإجراء تعديلات.
    </div>
  }

  <ol class="pipeline-track">
    @for (node of nodes(); track trackNode($index, node); let last = $last) {
      <li class="pipeline-item state-{{ node.state }}"
          [class.placeholder]="node.placeholder">
        <button type="button"
                class="pipeline-node"
                [class.clickable]="!node.placeholder && node.state === 'completed'"
                [attr.aria-current]="node.state === 'active' ? 'step' : null"
                [disabled]="node.placeholder"
                (click)="onNodeClick(node)">
          <span class="pipeline-node-dot">{{ iconFor(node.state) }}</span>
          <span class="pipeline-node-label">
            {{ node.label }}
            @if (node.placeholder) { <span class="pipeline-node-suffix">(المرحلة 5)</span> }
          </span>
        </button>
        @if (!last) {
          <span class="pipeline-connector"
                [class.connector-completed]="node.state === 'completed'"></span>
        }
      </li>
    }
  </ol>
</div>
